[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech545-syt1105"
version = "0.1.0"
description = "Reusable quantitative risk functions for FinTech 545"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["fintech545"]
